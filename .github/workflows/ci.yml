name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 离线检查：契约测试、发布边界（tarball 内容）、包元数据、token 预算、文档一致性。
# 需要真实 Motrix 的集成自测（npm run selftest）不进 CI。
jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22]
        include:
          # engines 同时允许 >=24；在 ubuntu 上补一个高版本，避免只测 22。
          - os: ubuntu-latest
            node: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Contract tests
        run: npm test
      - name: Release checks
        run: npm run release:check
      - name: Package contents
        run: npm pack --dry-run
