<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 256 256" fill="none" role="img" aria-label="Motrix 下载">
  <!-- dsh-motrix：Motrix 紫色渐变底 + 白色卡片 + 黑色凹槽与金色指示点（Motrix 图标元素），
       卡片内是下载箭头与托盘，表达「用 Motrix 下载」。 -->
  <defs>
    <linearGradient id="motrix-bg" x1="52" y1="16" x2="212" y2="248" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D6ADE9"/>
      <stop offset="0.52" stop-color="#9A78D8"/>
      <stop offset="1" stop-color="#3B4DB9"/>
    </linearGradient>
    <linearGradient id="motrix-card" x1="88" y1="56" x2="176" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F7FA"/>
      <stop offset="1" stop-color="#DEE0E5"/>
    </linearGradient>
    <linearGradient id="motrix-mark" x1="100" y1="96" x2="156" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6E50D6"/>
      <stop offset="1" stop-color="#3E4DB8"/>
    </linearGradient>
    <filter id="motrix-shadow" x="24" y="30" width="208" height="196" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2A1B66" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#motrix-bg)"/>
  <rect x="7.5" y="7.5" width="241" height="241" rx="52" stroke="#FFFFFF" stroke-opacity="0.26" stroke-width="3"/>
  <rect x="46" y="50" width="164" height="160" rx="28" fill="url(#motrix-card)" filter="url(#motrix-shadow)"/>
  <rect x="90" y="50" width="76" height="34" rx="10" fill="#1B1D22"/>
  <rect x="106" y="63" width="18" height="9" rx="2.5" fill="#E5D89A"/>
  <rect x="132" y="63" width="18" height="9" rx="2.5" fill="#E5D89A"/>
  <g stroke="url(#motrix-mark)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 98v38"/>
    <path d="M109 119l19 19 19-19"/>
    <path d="M101 150v15a11 11 0 0 0 11 11h32a11 11 0 0 0 11-11v-15"/>
  </g>
</svg>
